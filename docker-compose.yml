services:
  web:
    build: .
    image: freight-dw-source-verify:latest
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
